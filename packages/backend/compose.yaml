name: agent
services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent-local
      POSTGRES_DB: agent
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agent -d agent']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres-data:
