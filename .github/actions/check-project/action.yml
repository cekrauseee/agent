name: Check project
description: Install the locked workspace and run one project's quality gates.
inputs:
  project:
    description: Workspace package name.
    required: true
runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - name: Set up Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .node-version
        cache: pnpm
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
    - name: Format check
      shell: bash
      run: pnpm --filter '${{ inputs.project }}' format:check
    - name: Lint
      shell: bash
      run: pnpm --filter '${{ inputs.project }}' lint
    - name: Typecheck
      shell: bash
      run: pnpm --filter '${{ inputs.project }}' typecheck
    - name: Tests
      shell: bash
      run: pnpm --filter '${{ inputs.project }}' test
