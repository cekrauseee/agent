name: Environment CI

on:
  pull_request:
    branches: [main]
    paths:
      - ".env.example"
      - "docs/**"
      - "README.md"
      - ".github/actions/check-project/**"
      - ".github/workflows/environment.yml"
      - ".node-version"
      - "package.json"
      - "packages/environment/**"
      - "packages/eslint-config/**"
      - "packages/prettier-config/**"
      - "packages/typescript-config/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
  push:
    branches: [main]
    paths:
      - ".env.example"
      - "docs/**"
      - "README.md"
      - ".github/actions/check-project/**"
      - ".github/workflows/environment.yml"
      - ".node-version"
      - "package.json"
      - "packages/environment/**"
      - "packages/eslint-config/**"
      - "packages/prettier-config/**"
      - "packages/typescript-config/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: environment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Environment checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check project
        uses: ./.github/actions/check-project
        with:
          project: "@agent/environment"
